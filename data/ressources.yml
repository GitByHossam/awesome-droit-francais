# Source unique de toutes les entrées de la liste.
# Après toute modification :
#   python scripts/valider.py
#   python scripts/generer_readme.py
#
# Une URL en http:// n'est acceptée que si la ligne porte un commentaire
# « # http-autorise : justification ».

categories:
  sources-officielles:
    titre: "Sources officielles et API publiques"
    description: "Portails et API de l'État et des institutions européennes pour accéder aux textes et à la jurisprudence."
    ordre: 1
  donnees:
    titre: "Données juridiques réutilisables"
    description: "Extractions, dépôts Git et jeux de données prêts à l'emploi, construits à partir des données publiques."
    ordre: 2
  bibliotheques:
    titre: "Bibliothèques et clients d'API"
    description: "Code réutilisable pour interroger les API juridiques ou exploiter les bases de la DILA."
    ordre: 3
    sous_categories: [bibliotheques-python, bibliotheques-js]
  ia:
    titre: "IA juridique"
    description: "Ressources pour brancher des assistants IA sur le droit français, entraîner ou évaluer des modèles et protéger les données personnelles."
    ordre: 4
    sous_categories: [ia-mcp, ia-modeles, ia-benchmarks, ia-anonymisation]
  modeles-documents:
    titre: "Modèles de documents et automatisation"
    description: "Lettres types, formulaires et outils d'assemblage de documents."
    ordre: 5
  calculateurs:
    titre: "Calculateurs et simulateurs"
    description: "Outils de calcul de délais, d'indemnités, d'intérêts et de loyers. Les résultats restent indicatifs."
    ordre: 6
  droit-code:
    titre: "Outils publics et droit codé"
    description: "Services publics numériques et langages qui traduisent des règles juridiques en programmes."
    ordre: 7
  apprendre:
    titre: "Apprendre"
    description: "Formations et manuels pour les juristes qui veulent comprendre ou écrire du code."
    ordre: 8
  communautes:
    titre: "Communautés, événements et veille"
    description: "Associations, institutions et médias pour suivre l'actualité du droit et de la legaltech."
    ordre: 9
  listes-soeurs:
    titre: "Listes sœurs"
    description: "Autres listes de type awesome sur le droit, les données publiques ou la régulation de l'IA."
    ordre: 10
  archives:
    titre: "Projets archivés ou non maintenus"
    description: "Projets sans activité depuis plus de 24 mois. Ils restent utiles comme référence mais peuvent ne plus fonctionner."
    ordre: 11

sous_categories:
  bibliotheques-python:
    titre: "Python"
    ordre: 1
  bibliotheques-js:
    titre: "JavaScript et autres langages"
    ordre: 2
  ia-mcp:
    titre: "Serveurs MCP"
    ordre: 1
  ia-modeles:
    titre: "Modèles et embeddings"
    ordre: 2
  ia-benchmarks:
    titre: "Benchmarks et évaluation"
    ordre: 3
  ia-anonymisation:
    titre: "Anonymisation et pseudonymisation"
    ordre: 4

