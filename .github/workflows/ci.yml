name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    name: Validation, README et awesome-lint
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Valider data/ressources.yml
        run: python scripts/valider.py

      - name: Vérifier que README.md correspond au YAML
        run: |
          python scripts/generer_readme.py
          if ! git diff --exit-code README.md; then
            echo "::error file=README.md::README.md n'est pas à jour. Lancez python scripts/generer_readme.py et ajoutez le résultat au commit."
            exit 1
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lancer awesome-lint
        run: npx --yes awesome-lint@2.3.0 README.md
