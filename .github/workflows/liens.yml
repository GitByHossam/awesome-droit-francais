name: Vérification hebdomadaire des liens

on:
  schedule:
    # Chaque lundi à 6 h UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TITRE_ISSUE: "Rapport hebdomadaire des liens"

jobs:
  verifier:
    name: Liens et activité des dépôts
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les liens du README avec lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --accept : des sites publics protégés par un pare-feu applicatif
          #   peuvent répondre 403 ou 429 à un robot alors que la page
          #   fonctionne dans un navigateur. Ces codes sont acceptés pour
          #   éviter les faux positifs ; les vraies pannes (404, 410, 5xx,
          #   erreurs DNS ou TLS) restent signalées.
          # --exclude : les ancres internes du sommaire (#...) ne sont pas
          #   des liens web.
          # Ajoutez ici une exclusion de domaine uniquement si un site bloque
          # systématiquement les robots, avec un commentaire qui le justifie.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept '100..=103,200..=299,403,429'
            --exclude '^#'
            README.md
          output: rapport-liens.md
          fail: false

      - name: Contrôler les URL candidates de A_VERIFIER.md (hors issue)
        id: candidats
        uses: lycheeverse/lychee-action@v2
        with:
          # Preuve HTTP pour des ressources qui ne sont pas encore dans la
          # liste. Les échecs restent hors de l'issue hebdomadaire : ils ne
          # figurent que dans le résumé de l'exécution (onglet Summary).
          # --include-verbatim : les URL de A_VERIFIER.md sont écrites entre
          #   accents graves ; sans cette option, lychee n'en trouve aucune.
          # --verbose : ajoute au rapport les chaînes de redirection, utiles
          #   pour choisir l'adresse canonique.
          # Pas d'--accept 403,429 ici : seul un code 2xx vaut preuve ; un 403
          #   d'un pare-feu se vérifie à la main dans un navigateur.
          args: >-
            --no-progress
            --verbose
            --include-verbatim
            --max-retries 3
            --timeout 30
            A_VERIFIER.md
          output: rapport-candidats.md
          fail: false
          failIfEmpty: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Vérifier l'activité des dépôts GitHub
        id: activite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/verifier_activite.py --sortie rapport-activite.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ge 2 ]; then exit "$code"; fi
          exit 0

      - name: Ouvrir ou mettre à jour l'issue de rapport
        if: steps.lychee.outputs.exit_code != '0' || steps.activite.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIEN_EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Rapport généré automatiquement le $(date -u +%Y-%m-%d) par le workflow « Vérification hebdomadaire des liens »."
            echo
            echo "Exécution : ${LIEN_EXECUTION}"
            echo
            echo "## Liens du README"
            echo
            if [ -f rapport-liens.md ]; then cat rapport-liens.md; else echo "Rapport lychee absent."; fi
            echo
            cat rapport-activite.md
          } > corps-issue.md

          numero=$(gh issue list --state open --search "in:title \"${TITRE_ISSUE}\"" \
            --json number,title --jq "map(select(.title == \"${TITRE_ISSUE}\")) | .[0].number")

          if [ -n "$numero" ]; then
            gh issue edit "$numero" --body-file corps-issue.md
            gh issue comment "$numero" --body "Rapport mis à jour le $(date -u +%Y-%m-%d) : ${LIEN_EXECUTION}"
          else
            gh issue create --title "${TITRE_ISSUE}" --body-file corps-issue.md
          fi
